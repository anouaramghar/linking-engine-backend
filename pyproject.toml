[project]
name = "linkmesh-engine"
version = "0.1.0"
description = "Multi-site internal/external linking engine (CMHW Domains)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Task queue
    "rq>=2.0",
    "redis>=5.0",
    # Ingestion
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "httpcore>=1.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    # Heavy ML stack — install with: uv sync --extra ml
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "torch-geometric>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.24",
    "ruff>=0.6",
]

[tool.uv.sources]
# CPU-only wheels: PyPI's Linux torch bundles the full CUDA toolkit (~4 GB),
# which EMBEDDING_DEVICE=cpu never uses.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
