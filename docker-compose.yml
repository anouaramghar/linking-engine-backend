services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linkmesh
      POSTGRES_PASSWORD: linkmesh
      POSTGRES_DB: linkmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://linkmesh:linkmesh@db:5432/linkmesh
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 default
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://linkmesh:linkmesh@db:5432/linkmesh
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
