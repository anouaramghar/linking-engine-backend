# These override the same names in the env file, which points at the host ports
# a developer uses outside Docker. A service that needs to add one variable must
# merge this mapping (`<<: *app-env`) rather than write its own `environment:`
# block: the service-level key replaces the anchor's wholesale, and silently
# dropping DATABASE_URL sends the container at 127.0.0.1 instead of `db`.
x-app-env: &app-env
  DATABASE_URL: ${LINKMESH_DATABASE_URL:-postgresql+psycopg://linkmesh:linkmesh@db:5432/linkmesh}
  REDIS_URL: ${LINKMESH_REDIS_URL:-redis://redis:6379/0}
  BUILD_COMMIT: ${BUILD_COMMIT:-unknown}

x-app-service: &app-service
  image: ${LINKMESH_IMAGE:-linkmesh-engine:local}
  env_file:
    - ${LINKMESH_ENV_FILE:-.env}
  environment: *app-env

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmesh}
      POSTGRES_DB: ${POSTGRES_DB:-linkmesh}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  pool-scheduler-init:
    <<: *app-service
    # Register the unique repeating coordinator on every deployment. The
    # script is idempotent, so an existing schedule is reused, not duplicated.
    command: ["python", "scripts/schedule_pool_ingestion.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  site-scheduler-init:
    <<: *app-service
    # Register one coordinator for all managed-site schedules. The script is
    # idempotent, so redeployments reuse the existing repeating job.
    command: ["python", "scripts/schedule_site_automation.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    environment:
      <<: *app-env
      # uvicorn reads --workers from this. Every route is a sync `def` served on
      # the thread pool, so one process serializes their Python work on the GIL:
      # measured, one queue read took 18 ms and twenty concurrent ones took
      # 336 ms each — almost exactly twenty times one, which is what "serial"
      # looks like. Processes are what add parallelism here, not threads and not
      # connections. Four of them: 336 ms -> 111 ms median, 55 -> 137 req/s.
      #
      # It buys nothing for a lone user; one request is 18 ms either way. It is
      # for overlap — several editors on the queue, or one editor's polls landing
      # on top of a page load.
      #
      # The costs, both measured under the same load: memory 135 MiB -> 571 MiB,
      # because each process imports the app separately and copy-on-write does
      # not survive Python's reference counting; and PostgreSQL connections
      # 10 -> 22. Do not raise this above the host's core count (parallelism
      # stops, memory does not), and see `Settings.db_pool_size` for the
      # connection budget before going higher.
      #
      # Safe for the MCP app mounted at /mcp only because it is stateless_http.
      # A stateful session mode there would break across processes.
      WEB_CONCURRENCY: ${LINKMESH_API_WORKERS:-4}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-service
    # Keep the legacy service name for setup scripts; it owns ingestion plus
    # pre-stage jobs left on the historical default queue.
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--with-scheduler", "--url", "redis://redis:6379/0", "ingestion", "default"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pool-scheduler-init:
        condition: service_completed_successfully
      site-scheduler-init:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  worker-analysis:
    <<: *app-service
    # --with-scheduler is required: RQ parks delayed retries in
    # rq:scheduled:analysis, and only a worker running a scheduler promotes them
    # back onto the ready queue. Without it a retried job stays "scheduled"
    # forever, which the API reports to the dashboard as "analysis queued".
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--with-scheduler", "--url", "redis://redis:6379/0", "analysis"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  worker-publication:
    <<: *app-service
    # See worker-analysis: a queue with no scheduler never drains its retries.
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--with-scheduler", "--url", "redis://redis:6379/0", "publication"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-publication-preparation:
    <<: *app-service
    # Live reads and placement generation cannot occupy API or publication
    # capacity. Scale this service across sites; per-site duplicate guards remain.
    # See worker-analysis: a queue with no scheduler never drains its retries.
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--with-scheduler", "--url", "redis://redis:6379/0", "publication-preparation"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  telegram-bot:
    <<: *app-service
    # Long-polls Telegram for dashboard logins. Exactly one replica: two
    # concurrent getUpdates calls on one token make Telegram reject both with a
    # 409, so scaling this is a way to break login rather than speed it up.
    command: ["python", "-m", "app.telegram_bot"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../linking-engine-frontend
      dockerfile: Dockerfile
    image: ${LINKMESH_DASHBOARD_IMAGE:-linkmesh-dashboard:local}
    environment:
      # The nginx proxy talks to the API over the shared Compose network. The
      # frontend receives the same credential the API validates as API_KEY,
      # but keeps the browser unaware of it.
      BACKEND_URL: http://api:8000
      LINKMESH_API_KEY: ${LINKMESH_API_KEY:-${API_KEY:-}}
      LINKMESH_SERVER_NAMES: ${LINKMESH_SERVER_NAMES:-}
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  hf_cache:
