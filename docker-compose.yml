x-app-service: &app-service
  image: linkmesh-engine:local
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://linkmesh:linkmesh@db:5432/linkmesh
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linkmesh
      POSTGRES_PASSWORD: linkmesh
      POSTGRES_DB: linkmesh
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-service
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

volumes:
  pgdata:
  redisdata:
  hf_cache:
