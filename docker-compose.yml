x-app-service: &app-service
  image: linkmesh-engine:local
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://linkmesh:linkmesh@db:5432/linkmesh
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linkmesh
      POSTGRES_PASSWORD: linkmesh
      POSTGRES_DB: linkmesh
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-service
    # Keep the legacy service name for setup scripts; it owns ingestion plus
    # pre-stage jobs left on the historical default queue.
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--with-scheduler", "--url", "redis://redis:6379/0", "ingestion", "default"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  worker-analysis:
    <<: *app-service
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--url", "redis://redis:6379/0", "analysis"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  worker-publication:
    <<: *app-service
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--url", "redis://redis:6379/0", "publication"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-publication-preparation:
    <<: *app-service
    # Live reads and placement generation cannot occupy API or publication
    # capacity. Scale this service across sites; per-site duplicate guards remain.
    command: ["rq", "worker", "--worker-class", "app.worker.LinkMeshWorker", "--url", "redis://redis:6379/0", "publication-preparation"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - hf_cache:/home/linkmesh/.cache/huggingface

  telegram-bot:
    <<: *app-service
    # Long-polls Telegram for dashboard logins. Exactly one replica: two
    # concurrent getUpdates calls on one token make Telegram reject both with a
    # 409, so scaling this is a way to break login rather than speed it up.
    command: ["python", "-m", "app.telegram_bot"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  hf_cache:
